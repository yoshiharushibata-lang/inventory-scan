name: Create camera test v1 HUD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-camera-test-v1-hud.yml'

permissions:
  contents: write

jobs:
  create-hud-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Create HUD page from camera test v1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('camera_test_v1.html').read_text(encoding='utf-8')
          marker = '</body>'
          if src.count(marker) != 1:
              raise SystemExit('body marker mismatch')

          hud = r'''
  <div id="scanHud" style="position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:rgba(17,24,39,.92);color:#fff;border-radius:12px;padding:10px 12px;font:12px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 2px 12px rgba(0,0,0,.25);">
    <div style="font-weight:700;margin-bottom:4px;">読取計測HUD</div>
    <div id="hudLatest">起動→読取: -</div>
    <div><span id="hudCount">読取件数: 0</span> / <span id="hudDup">二重読取疑い: 0</span></div>
    <div id="hudLog" style="margin-top:4px;max-height:90px;overflow:auto;white-space:pre-wrap;color:#d1d5db;"></div>
  </div>
  <script>
    (()=>{
      const hud={latest:document.getElementById('hudLatest'),count:document.getElementById('hudCount'),dup:document.getElementById('hudDup'),log:document.getElementById('hudLog')};
      let cameraStartedAt=0,readCount=0,dupCount=0,lastCode='',lastReadAt=0;
      const status=document.getElementById('statusBox');
      if(!status||!window.MutationObserver)return;
      const stamp=()=>new Date().toLocaleTimeString('ja-JP',{hour12:false});
      const append=(line)=>{hud.log.textContent=(line+'\n'+hud.log.textContent).slice(0,1600);};
      const observeText=()=>{
        const text=String(status.textContent||'');
        if(text.includes('カメラを起動しました')){
          cameraStartedAt=performance.now();
          append(`${stamp()} カメラ起動`);
          return;
        }
        const m=text.match(/読み取り成功:\s*([^\n]+)/);
        if(!m)return;
        const now=performance.now();
        const code=String(m[1]||'').trim();
        const sec=cameraStartedAt?((now-cameraStartedAt)/1000):null;
        readCount+=1;
        if(code&&code===lastCode&&lastReadAt&&now-lastReadAt<=3000)dupCount+=1;
        lastCode=code;lastReadAt=now;
        hud.latest.textContent=`起動→読取: ${sec===null?'-':sec.toFixed(2)+'秒'}`;
        hud.count.textContent=`読取件数: ${readCount}`;
        hud.dup.textContent=`二重読取疑い: ${dupCount}`;
        append(`${stamp()} ${code||'(code不明)'} ${sec===null?'-':sec.toFixed(2)+'秒'}`);
      };
      new MutationObserver(observeText).observe(status,{childList:true,characterData:true,subtree:true});
      observeText();
    })();
  </script>
'''

          out = src.replace(marker, hud + '\n' + marker, 1)
          Path('camera_test_v1_hud.html').write_text(out, encoding='utf-8')
          PY

      - name: Validate HUD page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('camera_test_v1_hud.html').read_text(encoding='utf-8')
          base = Path('camera_test_v1.html').read_text(encoding='utf-8')
          for token in ["width:{ideal:1280},height:{ideal:720}","area:{top:'25%',right:'8%',left:'8%',bottom:'25%'}","frequency:8","focusMode:'continuous'","比較テスト用ページのため保存機能は無効です"]:
              if token not in s:
                  raise SystemExit(f'missing {token}')
          if 'id="scanHud"' not in s or 'MutationObserver' not in s or '二重読取疑い' not in s:
              raise SystemExit('HUD validation failed')
          if s.replace(s[s.index('  <div id="scanHud"'):s.rindex('</body>')], '') == base:
              pass
          PY
          git diff --check

      - name: Commit HUD page
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add camera_test_v1_hud.html
          git commit -m 'Add camera scan HUD comparison page'
          git push origin HEAD:main
