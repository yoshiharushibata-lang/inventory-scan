name: Promote camera A to production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-camera-a-to-production.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch production index camera settings only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          rep('height: 72px;', 'height: 115px;', 'scanner guide height')

          rep(
              "constraints:{facingMode:{ideal:'environment'},width:{ideal:960},height:{ideal:540}},area:{top:'34%',right:'10%',left:'10%',bottom:'34%'}},locator:{patchSize:'medium',halfSample:false},numOfWorkers:0,frequency:3,locate:true,decoder:{readers:['ean_reader']}",
              "constraints:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},area:{top:'25%',right:'8%',left:'8%',bottom:'25%'}},locator:{patchSize:'medium',halfSample:false},numOfWorkers:0,frequency:8,locate:true,decoder:{readers:['ean_reader']}",
              'camera settings')

          rep(
              "Quagga.start();state.scannerRunning=true;",
              "Quagga.start();state.scannerRunning=true;try{const video=els.scannerViewport.querySelector('video');const stream=video&&video.srcObject;const tracks=stream&&typeof stream.getVideoTracks==='function'?stream.getVideoTracks():[];const track=tracks&&tracks[0];if(track&&typeof track.getCapabilities==='function'&&typeof track.applyConstraints==='function'){const caps=track.getCapabilities()||{};const modes=Array.isArray(caps.focusMode)?caps.focusMode:[];if(modes.includes('continuous')){track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});}}}catch(e){}",
              'continuous autofocus')

          for token in [
              'const REQUIRED_STREAK = 2;',
              'const MAX_ACCEPTABLE_ERROR = 0.30;',
              "readers:['ean_reader']",
              'SAME_CODE_IGNORE_MS = 2000',
              "const API_URL = 'https://yellow-dream-2d6b.yoshiharu-shibata.workers.dev/';",
              'id="manualProductName"',
              '商品名を入力してください。',
              '候補なしでTEMP保存'
          ]:
              if token not in s:
                  raise SystemExit(f'protected token missing: {token}')

          if '比較テスト用ページのため保存機能は無効です' in s or 'scanHud' in s:
              raise SystemExit('test-only UI leaked into production')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate production file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>\n(.*)\n  </script>', s, re.S)
          if not m:
              raise SystemExit('script block not found')
          Path('/tmp/index.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/index.js
          git diff --check
          grep -q "width:{ideal:1280},height:{ideal:720}" index.html
          grep -q "area:{top:'25%',right:'8%',left:'8%',bottom:'25%'}" index.html
          grep -q "frequency:8" index.html
          grep -q "focusMode:'continuous'" index.html
          grep -q "height: 115px" index.html
          ! grep -q "比較テスト用ページのため保存機能は無効です" index.html
          ! grep -q "scanHud" index.html

      - name: Commit production camera improvement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Improve iPhone barcode camera scanning'
          git push origin HEAD:main
